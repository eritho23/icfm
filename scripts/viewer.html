<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICFM Log Viewer</title>
<style>
@font-face { font-family:"Berlin Grotesk"; src:url("font/berlin-grotesk/BerlinGrotesk-Regular.otf") format("opentype"); font-weight:400; font-style:normal; }
@font-face { font-family:"Berlin Grotesk"; src:url("font/berlin-grotesk/BerlinGrotesk-Medium.otf") format("opentype"); font-weight:500; font-style:normal; }
@font-face { font-family:"Berlin Grotesk"; src:url("font/berlin-grotesk/BerlinGrotesk-Bold.otf") format("opentype"); font-weight:700; font-style:normal; }

:root {
    --bg:#0D0D0D;
    --text:#FFEBDF;
    --primary:#2F7CB2;
    --muted:#8A8A8A;
    --panel:rgba(18,22,28,0.94);
}

html, body { margin:0; padding:0; height:100%; overflow:hidden; font:12px/1.4 "Berlin Grotesk",sans-serif; background:radial-gradient(circle at 20% 0%, #1a1a1a 0%, var(--bg) 48%); color:var(--text); }
#view3d { width:100%; height:100%; position:relative; }
#rocket3d { width:100%; height:100%; cursor:grab; }
/* Bottom metrics bar */
#metrics { position:absolute; bottom:0; left:0; right:0; display:flex; gap:12px; padding:6px 10px; background:rgba(13,13,13,0.95); overflow-x:auto; white-space:nowrap; pointer-events:none; backdrop-filter:blur(2px); }
.group { display:flex; flex-direction:row; align-items:center; gap:6px; min-width:max-content; }
.group h3 { margin:0; font-size:11px; font-weight:700; color:var(--muted); }
.metric { font-size:11px; display:flex; gap:2px; }
.metric span:last-child { font-variant-numeric:tabular-nums; }
/* Graph overlay */
#graphOverlay { position:absolute; top:0; right:0; width:40%; height:100%; background:rgba(13,13,13,0.96); padding:16px; box-sizing:border-box; overflow:auto; display:none; flex-direction:column; z-index:5; }
.chartBox { height:150px; margin-bottom:16px; }
.chartBox canvas { width:100%; height:100%; }
/* Toggle button */
#toggleGraphs { position:absolute; bottom:8px; right:8px; z-index:6; padding:6px 10px; background:var(--primary); color:var(--text); border:none; cursor:pointer; font-size:12px; font-weight:700; border-radius:4px; }
#toggleGraphs:hover { filter:brightness(1.06); }
#commandPanel { position:absolute; top:8px; left:8px; z-index:6; display:flex; gap:8px; align-items:center; background:var(--panel); border:none; border-radius:6px; padding:8px; }
.cmdBtn { padding:6px 10px; background:var(--primary); color:var(--text); border:none; cursor:pointer; font-size:12px; font-weight:700; border-radius:4px; }
.cmdBtn:hover { filter:brightness(1.06); }
#cmdStatus { font-size:11px; color:var(--muted); min-width:120px; }
</style>
</head>
<body>
<div id="view3d">
    <canvas id="rocket3d"></canvas>
    <div id="commandPanel">
        <button id="btnCalibrate" class="cmdBtn" type="button">Calibrate</button>
        <button id="btnReset" class="cmdBtn" type="button">Reset</button>
        <span id="cmdStatus">WS: connecting...</span>
    </div>
    <div id="metrics">
        <div class="group"><h3>Position:</h3>
            <span class="metric">p_x <span id="p_x">—</span></span>
            <span class="metric">p_y <span id="p_y">—</span></span>
            <span class="metric">p_z <span id="p_z">—</span></span>
        </div>
        <div class="group"><h3>Velocity:</h3>
            <span class="metric">v_x <span id="v_x">—</span></span>
            <span class="metric">v_y <span id="v_y">—</span></span>
            <span class="metric">v_z <span id="v_z">—</span></span>
        </div>
        <div class="group"><h3>Acceleration:</h3>
            <span class="metric">a_x <span id="a_x">—</span></span>
            <span class="metric">a_y <span id="a_y">—</span></span>
            <span class="metric">a_z <span id="a_z">—</span></span>
        </div>
        <div class="group"><h3>Gyro:</h3>
            <span class="metric">wx <span id="wx">—</span></span>
            <span class="metric">wy <span id="wy">—</span></span>
            <span class="metric">wz <span id="wz">—</span></span>
        </div>
        <div class="group"><h3>Attitude error:</h3>
            <span class="metric">dθ <span id="d_theta">—</span></span>
            <span class="metric">dα <span id="d_alpha">—</span></span>
            <span class="metric">dβ <span id="d_beta">—</span></span>
        </div>
        <div class="group"><h3>Quaternion:</h3>
            <span class="metric">w <span id="q_w">—</span></span>
            <span class="metric">x <span id="q_x">—</span></span>
            <span class="metric">y <span id="q_y">—</span></span>
            <span class="metric">z <span id="q_z">—</span></span>
        </div>
        <div class="group"><h3>Fins:</h3>
            <span class="metric">Fin0 <span id="fin0">—</span></span>
            <span class="metric">Fin1 <span id="fin1">—</span></span>
            <span class="metric">Fin2 <span id="fin2">—</span></span>
            <span class="metric">Fin3 <span id="fin3">—</span></span>
        </div>
    </div>
    <div id="toggleGraphs">Show Graphs</div>
</div>

<div id="graphOverlay">
    <div class="chartBox"><canvas id="chart_alt"></canvas></div>
    <div class="chartBox"><canvas id="chart_att"></canvas></div>
    <div class="chartBox"><canvas id="chart_acc"></canvas></div>
    <div class="chartBox"><canvas id="chart_fin"></canvas></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Overlay toggle
const toggleBtn = document.getElementById('toggleGraphs');
const overlay = document.getElementById('graphOverlay');
toggleBtn.addEventListener('click', () => {
    const showing = overlay.style.display==='flex';
    overlay.style.display = showing?'none':'flex';
    toggleBtn.textContent = showing?'Show Graphs':'Hide Graphs';
});
overlay.style.display='none';
overlay.style.flexDirection='column';

// ── Charts
Chart.defaults.font.family='Berlin Grotesk, sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.color='#FFEBDF';
function makeDS(label,color){return{label,data:[],borderColor:color,backgroundColor:color+'33',borderWidth:1.5,pointRadius:0,tension:0.1};}
function makeChart(id,datasets){return new Chart(document.getElementById(id),{type:'line',data:{labels:[],datasets},options:{animation:false,responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',align:'end',labels:{boxWidth:12,padding:4}}},scales:{x:{grid:{color:'rgba(80,80,80,0.35)',drawBorder:false},ticks:{maxTicksLimit:8}},y:{grid:{color:'rgba(80,80,80,0.35)',drawBorder:false},ticks:{maxTicksLimit:6}}}}});}
const chartAlt=makeChart('chart_alt',[makeDS('alt','#1f77b4'),makeDS('speed','#2ca02c')]);
const chartAtt=makeChart('chart_att',[makeDS('roll','#d62728'),makeDS('pitch','#ff7f0e'),makeDS('yaw','#9467bd')]);
const chartAcc=makeChart('chart_acc',[makeDS('a_x','#1f77b4'),makeDS('a_y','#2ca02c'),makeDS('a_z','#d62728')]);
const chartFin=makeChart('chart_fin',[makeDS('fin0','#1f77b4'),makeDS('fin1','#2ca02c'),makeDS('fin2','#ff7f0e'),makeDS('fin3','#d62728')]);
const MAX_POINTS=200; let commonTime=0;
function pushChart(chart,t,vals){chart.data.labels.push(t.toFixed(1)); vals.forEach((v,i)=>chart.data.datasets[i].data.push(v)); if(chart.data.labels.length>MAX_POINTS){chart.data.labels.shift(); chart.data.datasets.forEach(ds=>ds.data.shift());} chart.update('none');}

// ── Three.js 3D Rocket ──
const canvas3d=document.getElementById('rocket3d');
const renderer=new THREE.WebGLRenderer({canvas:canvas3d,antialias:true});
renderer.setClearColor(0x0d0d0d);
renderer.setPixelRatio(window.devicePixelRatio);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,2,0.1,100);

scene.add(new THREE.AmbientLight(0xffffff,0.45));
const dLight=new THREE.DirectionalLight(0xffffff,1.2);
dLight.position.set(3,6,4);
scene.add(dLight);
scene.add(new THREE.GridHelper(32,32,0x2a2a2a,0x1a1a1a));

// Rocket group gets firmware quaternion directly
const rocketGroup=new THREE.Group();
scene.add(rocketGroup);

// Rocket model stays in its native orientation
const rocketModel=new THREE.Group();
rocketGroup.add(rocketModel);

rocketModel.add(new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.2,2.5,24),
    new THREE.MeshStandardMaterial({color:0x3a3a3a,metalness:0.35,roughness:0.55})
));

const nose=new THREE.Mesh(
    new THREE.ConeGeometry(0.2,0.7,24),
    new THREE.MeshStandardMaterial({color:0x555555})
);
nose.position.y=1.6;
rocketModel.add(nose);

// Fins
const finColors=[0x1f77b4,0x2ca02c,0xff7f0e,0xd62728];
const hingeGroups=[];
const FIN_SCALE=3;
const finAngles=[0,0,0,0];

for(let i=0;i<4;i++){
    const orientGroup=new THREE.Group();
    orientGroup.rotation.y=i*Math.PI/2;
    rocketModel.add(orientGroup);

    const hingeGroup=new THREE.Group();
    hingeGroup.position.set(0.2,-0.8,0);
    orientGroup.add(hingeGroup);

    const shape=new THREE.Shape();
    shape.moveTo(0,0);
    shape.lineTo(0.38,-0.15);
    shape.lineTo(0.38,-0.6);
    shape.lineTo(0,-0.45);
    shape.closePath();

    const finMesh=new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshStandardMaterial({color:finColors[i],side:THREE.DoubleSide})
    );
    hingeGroups.push(finMesh);
    hingeGroup.add(finMesh);
}

// ── Camera controls
let CAM_R=7, thetaY=0.4, thetaX=0.2, drag=false, lx=0, ly=0;
canvas3d.addEventListener('mousedown',e=>{drag=true; lx=e.clientX; ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{if(!drag)return; thetaY-=(e.clientX-lx)*0.007; thetaX+=(e.clientY-ly)*0.004; thetaX=Math.max(-0.5,Math.min(0.8,thetaX)); lx=e.clientX; ly=e.clientY; });
canvas3d.addEventListener('wheel',e=>{ e.preventDefault(); CAM_R -= e.deltaY*0.01; CAM_R=Math.max(2,Math.min(12,CAM_R)); });
function resizeRenderer(){ const w=canvas3d.clientWidth,h=canvas3d.clientHeight; if(canvas3d.width!==w||canvas3d.height!==h){renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();} }
function animate(){ requestAnimationFrame(animate); resizeRenderer();
camera.position.x = CAM_R*Math.sin(thetaY)*Math.cos(thetaX);
camera.position.y = CAM_R*Math.sin(thetaX)+0.5;
camera.position.z = CAM_R*Math.cos(thetaY)*Math.cos(thetaX);
camera.lookAt(0,0,0);
for(let i=0;i<4;i++){ hingeGroups[i].rotation.x=-finAngles[i]*FIN_SCALE*Math.PI/180; }
renderer.render(scene,camera);}
animate();

function quatToEuler(w, x, y, z) {
    const n = Math.hypot(w, x, y, z) || 1;
    w /= n; x /= n; y /= n; z /= n;

    const roll  = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y));
    const pitch = Math.asin(Math.max(-1, Math.min(1, 2 * (w * y - z * x))));
    const yaw   = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z));

    return [roll, pitch, yaw];
}

// ── WebSocket
const ws=new WebSocket('ws://localhost:8765');
const btnCalibrate=document.getElementById('btnCalibrate');
const btnReset=document.getElementById('btnReset');
const cmdStatus=document.getElementById('cmdStatus');

function setCommandStatus(text){
    cmdStatus.textContent=text;
}

function sendCommand(cmd){
    if(ws.readyState!==WebSocket.OPEN){
        setCommandStatus('WS not connected');
        return;
    }
    ws.send(JSON.stringify({type:'command',cmd}));
    setCommandStatus('Sent: '+cmd);
}

btnCalibrate.addEventListener('click',()=>sendCommand('CALIBRATE'));
btnReset.addEventListener('click',()=>sendCommand('RESET'));

ws.onopen=()=>setCommandStatus('WS connected');
ws.onclose=()=>setCommandStatus('WS disconnected');
ws.onerror=()=>setCommandStatus('WS error');
ws.onmessage = e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='command_ack'){
        if(msg.ok){
            setCommandStatus('OK: '+msg.cmd);
        }else{
            setCommandStatus('ERR: '+(msg.reason||'command_failed'));
        }
        return;
    }
    if(msg.type==='kalman'){
        const d=msg.data; commonTime=d.t_s;

        // Update metrics
        for(const k of ['p_x','p_y','p_z','v_x','v_y','v_z','a_x','a_y','a_z','wx','wy','wz','d_theta','d_alpha','d_beta','q_w','q_x','q_y','q_z']){
            if(d[k]!==undefined) document.getElementById(k).textContent=d[k].toFixed(2);
        }

        // Update charts
        const speed=Math.hypot(d.v_x,d.v_y,d.v_z);
        const [roll,pitch,yaw]=quatToEuler(d.q_w,d.q_x,d.q_y,d.q_z);
        pushChart(chartAlt,commonTime,[d.p_z,speed]);
        pushChart(chartAtt,commonTime,[roll,pitch,yaw]);
        pushChart(chartAcc,commonTime,[d.a_x,d.a_y,d.a_z]);

        // ── Quaternion axis remapping ──
        // Firmware convention: X=roll axis, Y=pitch axis, Z=yaw axis (up)
        // Three.js convention: Y=up, rocket body along Y axis
        //
        // Observed mismatches (before fix):
        //   firmware roll  → showed as yaw  in 3D
        //   firmware pitch → showed as roll in 3D
        //   firmware yaw   → showed as pitch in 3D
        //
        // Remap: fw_x(roll)→three_z, fw_y(pitch)→three_x, fw_z(yaw)→three_y
        // As a quaternion component swap: (w, x, y, z) → (w, y, z, x)
        if(d.q_w!==undefined){
            const fw_w=d.q_w, fw_x=d.q_x, fw_y=d.q_y, fw_z=d.q_z;
            const n=Math.hypot(fw_w,fw_x,fw_y,fw_z)||1;
            // Remapped: three_x ← fw_z (yaw), three_y ← fw_x (roll), three_z ← fw_y (pitch)
            rocketGroup.quaternion.set(fw_z/n, fw_x/n, fw_y/n, fw_w/n);
        }
    } else if(msg.type==='ctrl'){
        const d=msg.data;
        const swap=[0,1,2,3];
        for(let i=0;i<4;i++){
            document.getElementById('fin'+i).textContent=d['fin'+swap[i]].toFixed(1);
            finAngles[i]=d['fin'+swap[i]];
        }
        pushChart(chartFin,commonTime,[d.fin0,d.fin1,d.fin2,d.fin3]);
    }
};
</script>
</body>
</html>
