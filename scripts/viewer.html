<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rocket Telemetry</title>
<style>
body { font-family: sans-serif; margin: 20px; }
h1 { font-size: 18px; margin-bottom: 10px; }
#metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.metric { font-size: 12px; }
canvas { border: 1px solid #ccc; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>Rocket Telemetry</h1>

<div id="metrics">
  <div>
    <h3>Position (m)</h3>
    <div class="metric">p_x: <span id="p_x">—</span></div>
    <div class="metric">p_y: <span id="p_y">—</span></div>
    <div class="metric">p_z: <span id="p_z">—</span></div>
  </div>
  <div>
    <h3>Velocity (m/s)</h3>
    <div class="metric">v_x: <span id="v_x">—</span></div>
    <div class="metric">v_y: <span id="v_y">—</span></div>
    <div class="metric">v_z: <span id="v_z">—</span></div>
  </div>
  <div>
    <h3>Acceleration (m/s²)</h3>
    <div class="metric">a_x: <span id="a_x">—</span></div>
    <div class="metric">a_y: <span id="a_y">—</span></div>
    <div class="metric">a_z: <span id="a_z">—</span></div>
  </div>
  <div>
    <h3>Gyro (rad/s)</h3>
    <div class="metric">wx: <span id="wx">—</span></div>
    <div class="metric">wy: <span id="wy">—</span></div>
    <div class="metric">wz: <span id="wz">—</span></div>
  </div>
  <div>
    <h3>Attitude error (rad)</h3>
    <div class="metric">dθ: <span id="d_theta">—</span></div>
    <div class="metric">dα: <span id="d_alpha">—</span></div>
    <div class="metric">dβ: <span id="d_beta">—</span></div>
  </div>
  <div>
    <h3>Quaternion</h3>
    <div class="metric">w: <span id="q_w">—</span></div>
    <div class="metric">x: <span id="q_x">—</span></div>
    <div class="metric">y: <span id="q_y">—</span></div>
    <div class="metric">z: <span id="q_z">—</span></div>
  </div>
  <div>
    <h3>Fins (°)</h3>
    <div class="metric">Fin0: <span id="fin0">—</span></div>
    <div class="metric">Fin1: <span id="fin1">—</span></div>
    <div class="metric">Fin2: <span id="fin2">—</span></div>
    <div class="metric">Fin3: <span id="fin3">—</span></div>
  </div>
</div>

<canvas id="chart_alt" width="600" height="150"></canvas>
<canvas id="chart_att" width="600" height="150"></canvas>
<canvas id="chart_acc" width="600" height="150"></canvas>
<canvas id="chart_fin" width="600" height="150"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const MAX_POINTS = 200;

function makeDS(label, color){ return {label, data: [], borderColor: color, fill:false}; }
function makeChart(id, datasets){
    const ctx = document.getElementById(id);
    return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets },
        options: { animation:false, responsive:false, scales:{ x:{ display:true }, y:{ beginAtZero:true } } }
    });
}

const chartAlt = makeChart('chart_alt', [ makeDS('p_z','blue'), makeDS('speed','green') ]);
const chartAtt = makeChart('chart_att', [ makeDS('roll','red'), makeDS('pitch','orange'), makeDS('yaw','purple') ]);
const chartAcc = makeChart('chart_acc', [ makeDS('a_x','blue'), makeDS('a_y','green'), makeDS('a_z','red') ]);
const chartFin = makeChart('chart_fin', [ makeDS('fin0','blue'), makeDS('fin1','green'), makeDS('fin2','orange'), makeDS('fin3','red') ]);

function pushChart(chart, t, vals){
    chart.data.labels.push(t.toFixed(1));
    vals.forEach((v,i)=>chart.data.datasets[i].data.push(v));
    if(chart.data.labels.length>MAX_POINTS){
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds=>ds.data.shift());
    }
    chart.update('none');
}

function quatToEuler(w,x,y,z){
    const n = Math.sqrt(w*w+x*x+y*y+z*z)||1;
    [w,x,y,z] = [w/n,x/n,y/n,z/n];
    const roll=Math.atan2(2*(w*x+y*z),1-2*(x*x+y*y));
    const sinp=Math.max(-1,Math.min(1,2*(w*y-z*x)));
    const pitch=Math.asin(sinp);
    const yaw=Math.atan2(2*(w*z+x*y),1-2*(y*y+z*z));
    return [roll,pitch,yaw];
}

const ws = new WebSocket('ws://localhost:8765');
ws.onmessage = e=>{
    const msg = JSON.parse(e.data);
    if(msg.type==='kalman'){
        const d = msg.data;
        // Update metrics
        for(const k of ['p_x','p_y','p_z','v_x','v_y','v_z','a_x','a_y','a_z','wx','wy','wz','d_theta','d_alpha','d_beta','q_w','q_x','q_y','q_z']){
            if(d[k]!==undefined) document.getElementById(k).textContent=d[k].toFixed(2);
        }
        // Charts
        const speed=Math.sqrt(d.v_x**2+d.v_y**2+d.v_z**2);
        const [roll,pitch,yaw]=quatToEuler(d.q_w,d.q_x,d.q_y,d.q_z);
        pushChart(chartAlt,d.t_s,[d.p_z,speed]);
        pushChart(chartAtt,d.t_s,[roll,pitch,yaw]);
        pushChart(chartAcc,d.t_s,[d.a_x,d.a_y,d.a_z]);
    } else if(msg.type==='ctrl'){
        const d = msg.data;
        for(let i=0;i<4;i++){
            document.getElementById('fin'+i).textContent=d['fin'+i].toFixed(1);
            pushChart(chartFin,d.t_s,[d.fin0,d.fin1,d.fin2,d.fin3]);
        }
    }
};
</script>
</body>
</html>
